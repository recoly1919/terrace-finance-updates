function switchLanguage(next){
  if(next!=='tr' && next!=='zh')return;
  try{localStorage.setItem('terrace_lang',next)}catch(e){}
  const target=new URL(window.location.href);
  target.searchParams.set('lang',next);
  // On same-language clicks, render immediately; otherwise use a guaranteed URL navigation.
  if(lang===next){updateLangButtons();return;}
  window.location.assign(target.pathname+target.search+target.hash);
}

  document.documentElement.lang=lang==='zh'?'zh-CN':'tr';

    if(btn){btn.setAttribute('aria-pressed',String(lang===code));}

  document.title=lang==='zh'?'Terrace | 投资管理':'Terrace | Yatırım Yönetimi';
}

function expenseTable(items,allowDelete=true){return table([t('date'),t('title'),t('kind'),t('category'),t('amount'),t('paidAmount'),t('stage'),t('actions')],items.map(e=>`<tr class="transaction-row"><td>${esc(e.date)}</td><td><button class="link" onclick="openExpenseDetails(${e.id})"><b>${esc(e.title)}</b></button><div class="tx-kind">${esc(e.supplier_name||e.subcategory||'')}</div></td><td>${kindLabel(e.transaction_kind)}</td><td>${c(e.category)}</td><td>${fmt(e.amount_fen)}</td><td>${fmt(e.paid_fen)}</td><td>${phaseBadge(e)}<div class="tx-kind">${badge(e)}</div></td><td><button class="link" onclick="openExpenseDetails(${e.id})">${t('details')}</button> <button class="link" onclick="openExpense(${e.id})">${t('edit')}</button> <button class="link" onclick="openPayment(${e.id})">+ ${t('paidAmount')}</button> ${allowDelete?`<button class="link" onclick="remove('expenses',${e.id})">${t('delete')}</button>`:''}</td></tr>`))}
function expenseView(){let items=filteredExpenses();return `<div class="headrow">${addButton(t('addExpense'),'openExpense')}<span class="muted">${items.length} / ${state.expenses.length} ${t('transactions')}</span></div><div class="section"><div class="filterrow"><label class="field"><span>${t('search')}</span><input id="expenseSearch" placeholder="${t('search')}" value="${esc(expenseFilter.q)}" oninput="filterExpenses('q',this.value)"></label><label class="field"><span>${t('kind')}</span><select onchange="filterExpenses('kind',this.value)"><option value="">${t('filterAll')}</option>${['service','product','order'].map(k=>`<option value="${k}" ${expenseFilter.kind===k?'selected':''}>${t(k)}</option>`).join('')}</select></label><label class="field"><span>${t('category')}</span><select onchange="filterExpenses('category',this.value)"><option value="">${t('filterAll')}</option>${Object.keys(CAT).map(k=>`<option value="${k}" ${expenseFilter.category===k?'selected':''}>${c(k)}</option>`).join('')}</select></label><label class="field"><span>${t('paymentState')}</span><select onchange="filterExpenses('status',this.value)"><option value="">${t('filterAll')}</option>${['open','partial','settled'].map(k=>`<option value="${k}" ${expenseFilter.status===k?'selected':''}>${t(k)}</option>`).join('')}</select></label></div><div id="expenseResult">${expenseTable(items)}</div></div>`}
function filterExpenses(k,v){expenseFilter[k]=v;if(k==='q'){let el=document.getElementById('expenseResult');if(el)el.innerHTML=expenseTable(filteredExpenses())}else render()}
function openExpenseDetails(id){let e=state.expenses.find(x=>x.id===id);if(!e)return;let pay=state.payments.filter(p=>p.expense_id===id),docs=state.documents.filter(d=>d.expense_id===id);let inner=`<div class="detail-hero"><div class="kind-header">${phaseBadge(e)}<span>${kindLabel(e.transaction_kind)}</span></div><h2>${esc(e.title)}</h2><div class="detail-stats"><div><small>${t('amount')}</small><b>${fmt(e.amount_fen)}</b></div><div><small>${t('paidAmount')}</small><b>${fmt(e.paid_fen)}</b></div><div><small>${t('remaining')}</small><b>${fmt(Math.max(0,e.amount_fen-e.paid_fen))}</b></div></div></div><div class="detailgrid"><div><b>${t('date')}</b><p>${esc(e.date)}</p></div><div><b>${t('category')}</b><p>${c(e.category)}${e.subcategory?' · '+esc(e.subcategory):''}</p></div><div><b>${t('supplier')}</b><p>${esc(e.supplier_name||'—')}</p></div><div><b>${t('dueDate')}</b><p>${esc(e.due_date||'—')}</p></div><div><b>${t('purchaseStatus')}</b><p>${purchaseLabel(e.purchase_status)}</p></div><div><b>${t('deliveryStatus')}</b><p>${deliveryLabel(e.delivery_status)} ${esc(e.delivery_date||'')}</p></div><div><b>${t('reference')}</b><p>${esc(e.reference||'—')}</p></div><div><b>${t('paymentState')}</b><p>${badge(e)}</p></div></div><h3>${t('notes')}</h3><p class="empty-hint">${esc(e.notes||'—')}</p><h3>${t('paymentHistory')}</h3>${pay.length?table([t('date'),t('amount'),t('method'),t('paidBy')],pay.map(p=>`<tr><td>${esc(p.date)}</td><td>${fmt(p.amount_fen)}</td><td>${mt(p.method)}</td><td>${esc(p.paid_by||'—')}</td></tr>`)):`<p class="muted">${t('noPayments')}</p>`}<h3>${t('documents')}</h3>${docs.map(d=>`<div><a href="/api/documents/${d.id}">${esc(d.filename)}</a></div>`).join('')||`<p class="muted">${t('noData')}</p>`}<div class="actions"><button class="btn alt" onclick="closeModal()">${t('cancel')}</button><button class="btn" onclick="openExpense(${id})">${t('edit')}</button><button class="btn" onclick="openPayment(${id})">+ ${t('paidAmount')}</button></div>`;document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">${inner}</div></div>`;document.getElementById('modalRoot').classList.remove('hidden')}
function purchaseView(){let items=state.expenses.filter(e=>e.purchase_status!=='cancelled');let total=items.reduce((v,e)=>v+e.amount_fen,0), paid=items.reduce((v,e)=>v+e.paid_fen,0);let fields=[t('title'),t('supplier'),t('purchaseStatus'),t('deliveryStatus'),t('deliveryDate'),t('amount'),t('paidAmount'),t('remaining'),t('actions')];let rows=state.expenses.map(e=>`<tr><td>${esc(e.title)}</td><td>${esc(e.supplier_name||'—')}</td><td>${purchaseLabel(e.purchase_status)}</td><td>${deliveryLabel(e.delivery_status)}</td><td>${esc(e.delivery_date||'—')}</td><td>${fmt(e.amount_fen)}</td><td>${fmt(e.paid_fen)}</td><td>${fmt(e.amount_fen-e.paid_fen)}</td><td><button class="link" onclick="openExpense(${e.id})">${t('edit')}</button> <button class="link" onclick="openExpenseDetails(${e.id})">${t('details')}</button></td></tr>`);return `<div class="cards">${card(t('purchaseTotal'),fmt(total))}${card(t('paid'),fmt(paid))}${card(t('unpaid'),fmt(total-paid))}</div><div class="headrow">${addButton(t('addExpense'),'openExpense')}</div><div class="section">${table(fields,rows)}</div>`}
function purchaseLabel(k){return ({planned:t('planned'),ordered:t('ordered'),cancelled:t('cancelled')})[k]||k}
function deliveryLabel(k){return ({pending:t('pending'),partial:t('partialDelivery'),delivered:t('delivered'),na:t('notApplicable')})[k]||k}
function kindLabel(k){return t(['service','product','order'].includes(k)?k:'service')}
function phaseBadge(e){let k=e.purchase_status==='cancelled'?'cancelled':e.delivery_status==='delivered'?'completed':e.transaction_kind==='service'&&e.purchase_status==='ordered'?'inProgress':e.transaction_kind==='product'&&e.paid_fen>=e.amount_fen?'completed':e.purchase_status==='ordered'&&e.transaction_kind==='order'?'delivering':e.purchase_status==='ordered'?'inProgress':'planned';let map={cancelled:['red','✕',t('cancelled')],completed:['green','✓',t('completed')],inProgress:['orange','◷',t('inProgress')],delivering:['blue','▣',t('delivering')],planned:['gray','○',t('planned')]};let x=map[k];return `<span class="phase ${x[0]}">${x[1]} ${x[2]}</span>`}
function filteredExpenses(){let q=expenseFilter.q.trim().toLocaleLowerCase();return state.expenses.filter(e=>(!q||[e.title,e.notes,e.supplier_name,e.reference,e.subcategory].some(x=>String(x||'').toLocaleLowerCase().includes(q)))&&(!expenseFilter.kind||(e.transaction_kind||'service')===expenseFilter.kind)&&(!expenseFilter.category||e.category===expenseFilter.category)&&(!expenseFilter.status||(expenseFilter.status==='settled'?e.paid_fen>=e.amount_fen:expenseFilter.status==='partial'?e.paid_fen>0&&e.paid_fen<e.amount_fen:e.paid_fen===0)))}
function actionName(k){return ({create:lang==='zh'?'创建':'Oluşturma',update:lang==='zh'?'修改':'Düzenleme',delete:lang==='zh'?'删除':'Silme'})[k]||k}
function auditDesc(a){
 let target=a.record_name||'';
 if(!target&&a.details){try{const d=JSON.parse(a.details);target=d.title||d.name||d.category||''}catch{target=a.details}}
 if(!target)target=(lang==='zh'?'记录 #':'Kayıt #')+a.record_id;
 const who=a.actor||(lang==='zh'?'未知用户':'Bilinmeyen kullanıcı');
 let title;
 if(lang==='zh'){
  const names={expenses:'业务',payments:'付款',suppliers:'供应商',documents:'文件',budgets:'预算',users:'用户'};
  const verbs={create:'新增了',update:'更新了',delete:'删除了'};
  title=who+' · '+(verbs[a.action]||'操作了')+(names[a.record_type]||'记录');
 } else {
  const verbs={create:'oluşturdu',update:'güncelledi',delete:'sildi'};
  const entities={expenses:'işlem kaydı',payments:'ödeme kaydı',suppliers:'tedarikçi',documents:'belge',budgets:'bütçe',users:'kullanıcı'};
  const entity=entities[a.record_type]||'kayıt';
  const phrase=a.action==='create'?(a.record_type==='payments'?'ödeme kaydetti':a.record_type==='documents'?'belge yükledi':a.record_type==='suppliers'?'tedarikçi ekledi':a.record_type==='users'?'kullanıcı ekledi':a.record_type==='budgets'?'bütçe oluşturdu':'işlem oluşturdu'):
   a.action==='update'?entity+' güncelledi':entity+' sildi';
  title=who+' · '+phrase;
 }
 const detail=a.payment_amount_fen?fmt(a.payment_amount_fen)+' · '+target:target;
 return {title,detail};
}
function drawAudit(){let select=document.getElementById('auditUser');if(select){let users=[...new Set(auditItems.map(x=>x.actor).filter(Boolean))].sort();select.innerHTML='<option value="">'+t('filterAll')+'</option>'+users.map(v=>`<option value="${esc(v)}" ${auditFilter.user===v?'selected':''}>${esc(v)}</option>`).join('')}drawAuditResults()}
function drawAuditResults(){let box=document.getElementById('activityItems');if(!box)return;let filtered=auditItems.filter(a=>{let x=auditDesc(a),q=auditFilter.q.toLocaleLowerCase();return(!q||[x.title,x.detail,a.actor,a.details,a.record_type,a.action].some(v=>String(v||'').toLocaleLowerCase().includes(q)))&&(!auditFilter.user||a.actor===auditFilter.user)&&(!auditFilter.action||a.action===auditFilter.action)&&(!auditFilter.from||a.created_at.slice(0,10)>=auditFilter.from)&&(!auditFilter.to||a.created_at.slice(0,10)<=auditFilter.to)});box.innerHTML=filtered.map(a=>{let d=auditDesc(a),type=a.record_type==='payments'&&a.action==='create'?'payment':a.action,k=type==='create'?'＋':type==='update'?'↻':type==='delete'?'×':'¥';let date=new Date(a.created_at);let at=Number.isFinite(date.getTime())?date.toLocaleString(lang==='zh'?'zh-CN':'tr-TR',{dateStyle:'medium',timeStyle:'short'}):a.created_at;return `<div class="history-card"><div class="history-icon ${type}">${k}</div><div><div class="history-title"><b>${esc(d.title)}</b></div><div class="history-desc">${esc(d.detail)}</div><div class="history-meta">${esc(at)} · #${a.id}</div></div></div>`}).join('')||`<p class="empty-hint">${t('auditNoData')}</p>`}
function activityView(){queueMicrotask(async()=>{try{auditItems=await api('/activity');if(tab==='activity')drawAudit()}catch(e){toast(e.message,true)}});return `<div class="section"><div class="history-toolbar"><label>${t('search')}<input id="auditQ" placeholder="${t('auditSearch')}" value="${esc(auditFilter.q)}" oninput="auditFilter.q=this.value;drawAuditResults()"></label><label>${t('auditUser')}<select id="auditUser" onchange="auditFilter.user=this.value;drawAuditResults()"><option value="">${t('filterAll')}</option></select></label><label>${t('auditAction')}<select onchange="auditFilter.action=this.value;drawAuditResults()"><option value="">${t('filterAll')}</option>${['create','update','delete'].map(k=>`<option value="${k}" ${auditFilter.action===k?'selected':''}>${actionName(k)}</option>`).join('')}</select></label><label>${t('from')}<input type="date" value="${auditFilter.from}" onchange="auditFilter.from=this.value;drawAuditResults()"></label><label>${t('to')}<input type="date" value="${auditFilter.to}" onchange="auditFilter.to=this.value;drawAuditResults()"></label></div><div id="activityItems"><p class="empty-hint">${t('noActivity')}</p></div></div>`}
function paymentView(){return `<div class="headrow">${addButton(t('addPayment'),'openPayment')}<span class="muted">${state.payments.length} ${t('payments')}</span></div><div class="section">${table([t('date'),t('linked'),t('amount'),t('method'),t('paidBy'),t('actions')],state.payments.map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.expense_title)}</td><td>${fmt(p.amount_fen)}</td><td>${mt(p.method)}</td><td>${esc(p.paid_by||'—')}</td><td><button class="link" onclick="openPaymentEdit(${p.id})">${t('edit')}</button> <button class="link" onclick="remove('payments',${p.id})">${t('delete')}</button></td></tr>`))}</div>`}
function budgetView(){let total=state.budgets.reduce((a,x)=>a+x.amount_fen,0);return `<div class="headrow">${addButton(t('addBudget'),'openBudget')}<span class="muted">${t('budget')}: ${fmt(total)}</span></div><div class="section">${table([t('category'),t('budgeted'),t('committed'),t('difference'),t('usage')],Object.keys(CAT).map(k=>{let b=state.budgets.find(x=>x.category===k)?.amount_fen||0,spent=state.expenses.filter(x=>x.category===k&&x.purchase_status!=='cancelled').reduce((a,x)=>a+x.amount_fen,0);return `<tr><td>${c(k)}</td><td>${fmt(b)}</td><td>${fmt(spent)}</td><td style="color:${spent>b?'#b54d45':'#247969'}">${fmt(b-spent)}</td><td>${b?Math.round(spent/b*100)+'%':'—'}</td></tr>`}))}</div>`}
function supplierFiltered(){let q=supplierFilter.q.trim().toLocaleLowerCase();return state.suppliers.filter(s=>{let expenses=state.expenses.filter(e=>e.supplier_id===s.id&&e.purchase_status!=='cancelled');let balance=expenses.reduce((n,e)=>n+Math.max(0,e.amount_fen-e.paid_fen),0);return(!q||[s.name,s.contact,s.phone,s.wechat,s.notes].some(v=>String(v||'').toLocaleLowerCase().includes(q)))&&(!supplierFilter.category||expenses.some(e=>e.category===supplierFilter.category))&&(!supplierFilter.balance||(supplierFilter.balance==='due'?balance>0:balance===0))})}
function supplierView(){let rows=supplierFiltered().map(s=>{let ex=state.expenses.filter(e=>e.supplier_id===s.id&&e.purchase_status!=='cancelled'),balance=ex.reduce((n,e)=>n+Math.max(0,e.amount_fen-e.paid_fen),0);return `<tr><td><b>${esc(s.name)}</b><div class="supplier-muted">${esc(s.contact||'')}</div></td><td>${esc(s.phone||'—')}</td><td>${esc(s.wechat||'—')}</td><td>${ex.length}</td><td class="supplier-balance">${fmt(balance)}</td><td><button class="link" onclick="openSupplier(${s.id})">${t('edit')}</button></td></tr>`});return `<div class="headrow">${addButton(t('addSupplier'),'openSupplier')}<span class="muted">${supplierFiltered().length} / ${state.suppliers.length}</span></div><div class="section"><div class="supplier-filters"><input type="search" aria-label="${t('search')}" placeholder="${t('supplierSearch')}" value="${esc(supplierFilter.q)}" oninput="supplierFilter.q=this.value;updateSupplierResults()"><select aria-label="${t('supplierCategory')}" onchange="supplierFilter.category=this.value;updateSupplierResults()"><option value="">${t('supplierCategory')} · ${t('filterAll')}</option>${Object.keys(CAT).map(k=>`<option value="${k}" ${supplierFilter.category===k?'selected':''}>${esc(c(k))}</option>`).join('')}</select><select aria-label="${t('supplierBalance')}" onchange="supplierFilter.balance=this.value;updateSupplierResults()"><option value="">${t('supplierBalance')} · ${t('filterAll')}</option><option value="due" ${supplierFilter.balance==='due'?'selected':''}>${t('hasBalance')}</option><option value="none" ${supplierFilter.balance==='none'?'selected':''}>${t('noBalance')}</option></select></div><div id="supplierResults">${table([t('name'),t('phone'),t('wechat'),t('supplierOrders'),t('outstanding'),t('actions')],rows)}</div></div>`}
function updateSupplierResults(){let box=document.getElementById('supplierResults');if(!box)return;let rows=supplierFiltered().map(s=>{let ex=state.expenses.filter(e=>e.supplier_id===s.id&&e.purchase_status!=='cancelled'),balance=ex.reduce((n,e)=>n+Math.max(0,e.amount_fen-e.paid_fen),0);return `<tr><td><b>${esc(s.name)}</b><div class="supplier-muted">${esc(s.contact||'')}</div></td><td>${esc(s.phone||'—')}</td><td>${esc(s.wechat||'—')}</td><td>${ex.length}</td><td class="supplier-balance">${fmt(balance)}</td><td><button class="link" onclick="openSupplier(${s.id})">${t('edit')}</button></td></tr>`});box.innerHTML=table([t('name'),t('phone'),t('wechat'),t('supplierOrders'),t('outstanding'),t('actions')],rows)}
function documentView(){return `<div class="headrow">${addButton(t('addDocument'),'openDocument')}<span class="muted">${state.documents.length}</span></div><div class="section">${table([t('filename'),t('linked'),t('uploadDate'),t('actions')],state.documents.map(d=>`<tr><td>${esc(d.filename)}</td><td>${esc(state.expenses.find(e=>e.id===d.expense_id)?.title||'—')}</td><td>${esc(d.created_at.slice(0,10))}</td><td><button class="link" onclick="location.href='/api/documents/${d.id}'">${t('show')}</button> <button class="link" onclick="remove('documents',${d.id})">${t('delete')}</button></td></tr>`))}</div>`}
function userView(){return `<div class="headrow">${me.role==='owner'?addButton(t('addUser'),'openUser'):''}<span class="muted">${t('usersHint')}</span></div><div class="section" id="usersTable">${t('noData')}</div>`+(queueMicrotask(loadUsers),'')}
async function loadUsers(){try{let users=await api('/users'),div=document.getElementById('usersTable');if(tab==='users'&&div)div.innerHTML=table([t('fullname'),t('username'),t('status')],users.map(u=>`<tr><td>${esc(u.fullname)}</td><td>${esc(u.username)}</td><td>${u.role==='owner'?t('owner'):t('partner')}</td></tr>`))}catch(e){toast(e.message,true)}}
function opts(dict,fn=c){return Object.keys(dict).map(k=>`<option value="${k}">${fn(k)}</option>`).join('')}
function supplierOpts(){return `<option value="">—</option>`+state.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}
function expenseOpts(){return state.expenses.map(e=>`<option value="${e.id}">${esc(e.title)} (${fmt(e.amount_fen-e.paid_fen)} ${t('remaining')})</option>`).join('')}
function input(name,label,type='text',required=false,val=''){return `<label class="field"><span>${label}</span><input name="${name}" type="${type}" ${required?'required':''} value="${esc(val)}" ${type==='number'?'min="0" step="0.01"':''}></label>`}
function select(name,label,html){return `<label class="field"><span>${label}</span><select name="${name}">${html}</select></label>`}
function notes(){return `<label class="field full"><span>${t('notes')}</span><textarea name="notes"></textarea></label>`}
function modal(title,fields,action,upload=false){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="closeModal(event)"><div class="modal" onclick="event.stopPropagation()"><h2>${title}</h2><form id="dialogForm" ${upload?'enctype="multipart/form-data"':''}><div class="formgrid">${fields}</div><div class="actions"><button class="btn alt" type="button" onclick="closeModal()">${t('cancel')}</button><button class="btn">${t('save')}</button></div></form></div></div>`;document.getElementById('modalRoot').classList.remove('hidden');document.getElementById('dialogForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await action(f);closeModal();await refresh();toast(t('created'))}catch(e){toast(e.message,true)}}}
function closeModal(){document.getElementById('modalRoot').classList.add('hidden');document.getElementById('modalRoot').innerHTML=''}
function formJSON(f){let x=Object.fromEntries(f);if(!x.supplier_id)delete x.supplier_id;else x.supplier_id=Number(x.supplier_id);if(x.expense_id)x.expense_id=Number(x.expense_id);if(x.amount)x.amount=Number(x.amount);return x}
async function create(path,f){return api(path,{method:'POST',body:JSON.stringify(formJSON(f))})}
function assignForm(values){let f=document.getElementById('dialogForm');for(let [k,v] of Object.entries(values)){let el=f.elements.namedItem(k);if(el)el.value=v??''}}
async function saveForm(path,f,method='POST'){return api(path,{method,body:JSON.stringify(formJSON(f))})}
function openExpense(id=null){let e=state.expenses.find(x=>x.id===id);let fields=input('title',t('title'),'text',true)+select('transaction_kind',t('kind'),['service','product','order'].map(k=>`<option value="${k}">${t(k)}</option>`).join(''))+select('category',t('category'),opts(CAT))+input('subcategory',t('subcategory'))+input('date',t('date'),'date',true,localISODate())+input('amount',t('amount'),'number',true)+input('due_date',t('dueDate'),'date')+input('reference',t('reference'))+select('purchase_status',t('purchaseStatus'),'<option value="planned">'+t('planned')+'</option><option value="ordered">'+t('ordered')+'</option><option value="cancelled">'+t('cancelled')+'</option>')+select('delivery_status',t('deliveryStatus'),'<option value="pending">'+t('pending')+'</option><option value="partial">'+t('partialDelivery')+'</option><option value="delivered">'+t('delivered')+'</option><option value="na">'+t('notApplicable')+'</option>')+input('delivery_date',t('deliveryDate'),'date')+select('supplier_id',t('supplier'),supplierOpts())+notes();modal(e?t('edit'):t('addExpense'),fields,f=>saveForm(e?'/expenses/'+id:'/expenses',f,e?'PUT':'POST'));if(e)assignForm({...e,amount:e.amount_fen/100});else document.querySelector('[name=delivery_status]').value='na'}
function openPayment(id){if(!state.expenses.length){toast(t('addExpense'),true);return}modal(t('addPayment'),select('expense_id',t('linked'),expenseOpts())+input('date',t('date'),'date',true,localISODate())+input('amount',t('amount'),'number',true)+select('method',t('method'),opts(METHODS,mt))+input('paid_by',t('paidBy'))+notes(),f=>create('/payments',f));if(id)document.querySelector('[name=expense_id]').value=id}
function openPaymentEdit(id){let p=state.payments.find(x=>x.id===id);if(!p)return;modal(t('edit')+' · '+t('payments'),select('expense_id',t('linked'),expenseOpts())+input('date',t('date'),'date',true)+input('amount',t('amount'),'number',true)+select('method',t('method'),opts(METHODS,mt))+input('paid_by',t('paidBy'))+notes(),f=>saveForm('/payments/'+id,f,'PUT'));assignForm({...p,amount:p.amount_fen/100})}
function openBudget(){modal(t('addBudget'),select('category',t('category'),opts(CAT))+input('amount',t('amount'),'number',true),f=>create('/budgets',f))}
function openSupplier(id=null){let x=state.suppliers.find(y=>y.id===id);modal(x?t('edit'):t('addSupplier'),input('name',t('name'),'text',true)+input('contact',t('contact'))+input('phone',t('phone'))+input('wechat',t('wechat'))+notes(),f=>saveForm(x?'/suppliers/'+id:'/suppliers',f,x?'PUT':'POST'));if(x)assignForm(x)}

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modalRoot').classList.contains('hidden'))closeModal();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch').focus()}});
// Terrace Finance V2.3 — compact list paging, bounded dialogs and searchable, scrollable linked-record fields.
const PAGELABEL={tr:{rows:'Kayıt / sayfa',showing:'gösteriliyor',page:'Sayfa',of:'/',previous:'Önceki',next:'Sonraki',pick:'Kayıt ara ve seç…',choose:'Listeden bir kayıt seçin',none:'Seçim yok',noResult:'Sonuç bulunamadı'},zh:{rows:'每页条数',showing:'条记录',page:'第',of:'/',previous:'上一页',next:'下一页',pick:'搜索并选择记录…',choose:'请从列表中选择',none:'不选择',noResult:'没有搜索结果'}};
const PAGES={expenses:1,payments:1,activity:1,suppliers:1,documents:1,users:1};
const PAGE_SIZES={expenses:30,payments:30,activity:30,suppliers:30,documents:30,users:30};
const pl=k=>PAGELABEL[lang][k]||k;
function paged(key,items){const size=PAGE_SIZES[key]||30,total=items.length,pages=Math.max(1,Math.ceil(total/size));PAGES[key]=Math.max(1,Math.min(PAGES[key]||1,pages));const start=(PAGES[key]-1)*size;return {rows:items.slice(start,start+size),total,start,pages,page:PAGES[key],size};}
function pager(key,page){const {total,start,pages,size}=page;const current=page.page;
  if(total===0)return `<div class="list-pagination empty-pager"><span>0 ${pl('showing')}</span></div>`;
  let nums=[];let a=Math.max(1,current-2),b=Math.min(pages,current+2);if(b-a<4){a=Math.max(1,b-4);b=Math.min(pages,a+4)}
  if(a>1)nums.push(1);if(a>2)nums.push('…');for(let i=a;i<=b;i++)nums.push(i);if(b<pages-1)nums.push('…');if(b<pages)nums.push(pages);
  const button=n=>n==='…'?`<span class="page-ellipsis" aria-hidden="true">…</span>`:`<button type="button" class="page-number ${n===current?'current':''}" ${n===current?'aria-current="page"':''} onclick="goListPage('${key}',${n})">${n}</button>`;
  return `<nav class="list-pagination" aria-label="${pl('page')}"><div class="page-count">${start+1}–${Math.min(start+size,total)} / ${total} ${pl('showing')}</div><div class="page-controls"><label class="page-size-label">${pl('rows')} <select aria-label="${pl('rows')}" onchange="changeListPageSize('${key}',this.value)"><option value="30" ${size===30?'selected':''}>30</option><option value="40" ${size===40?'selected':''}>40</option></select></label><button type="button" class="page-arrow" ${current===1?'disabled':''} onclick="goListPage('${key}',${current-1})">‹ <span>${pl('previous')}</span></button>${nums.map(button).join('')}<button type="button" class="page-arrow" ${current===pages?'disabled':''} onclick="goListPage('${key}',${current+1})"><span>${pl('next')}</span> ›</button></div></nav>`;
}
function updateListSection(key){
 if(key==='expenses'){drawExpenseResults();return}
 if(key==='activity'){drawAuditResults();return}
 if(key==='suppliers'){updateSupplierResults();return}
 if(key==='users'){loadUsers();return}
 render();
}
function goListPage(key,num){PAGES[key]=Math.max(1,Math.floor(Number(num)||1));updateListSection(key);document.querySelector('.list-pagination')?.scrollIntoView({block:'nearest',behavior:'instant'});}
function changeListPageSize(key,size){PAGE_SIZES[key]=Number(size)===40?40:30;PAGES[key]=1;updateListSection(key)}
function expenseResultsHtml(){const r=paged('expenses',filteredExpenses());return expenseTable(r.rows)+pager('expenses',r)}
function drawExpenseResults(){const el=document.getElementById('expenseResult');if(el)el.innerHTML=expenseResultsHtml()}
function expenseView(){return `<div class="headrow">${addButton(t('addExpense'),'openExpense')}<span class="muted">${filteredExpenses().length} / ${state.expenses.length} ${t('transactions')}</span></div><div class="section"><div class="filterrow"><label class="field"><span>${t('search')}</span><input id="expenseSearch" placeholder="${t('search')}" value="${esc(expenseFilter.q)}" oninput="filterExpenses('q',this.value)"></label><label class="field"><span>${t('kind')}</span><select onchange="filterExpenses('kind',this.value)"><option value="">${t('filterAll')}</option>${['service','product','order'].map(k=>`<option value="${k}" ${expenseFilter.kind===k?'selected':''}>${t(k)}</option>`).join('')}</select></label><label class="field"><span>${t('category')}</span><select onchange="filterExpenses('category',this.value)"><option value="">${t('filterAll')}</option>${Object.keys(CAT).map(k=>`<option value="${k}" ${expenseFilter.category===k?'selected':''}>${c(k)}</option>`).join('')}</select></label><label class="field"><span>${t('paymentState')}</span><select onchange="filterExpenses('status',this.value)"><option value="">${t('filterAll')}</option>${['open','partial','settled'].map(k=>`<option value="${k}" ${expenseFilter.status===k?'selected':''}>${t(k)}</option>`).join('')}</select></label></div><div id="expenseResult">${expenseResultsHtml()}</div></div>`}
function filterExpenses(key,value){expenseFilter[key]=value;PAGES.expenses=1;if(key==='q')drawExpenseResults();else render()}
function paymentView(){const r=paged('payments',state.payments);let rows=r.rows.map(p=>`<tr><td>${esc(p.date)}</td><td>${esc(p.expense_title)}</td><td>${fmt(p.amount_fen)}</td><td>${mt(p.method)}</td><td>${esc(p.paid_by||'—')}</td><td><button class="link" onclick="openPaymentEdit(${p.id})">${t('edit')}</button> <button class="link" onclick="remove('payments',${p.id})">${t('delete')}</button></td></tr>`);return `<div class="headrow">${addButton(t('addPayment'),'openPayment')}<span class="muted">${r.total} ${t('payments')}</span></div><div class="section">${table([t('date'),t('linked'),t('amount'),t('method'),t('paidBy'),t('actions')],rows)}${pager('payments',r)}</div>`}
function drawAuditResults(){let box=document.getElementById('activityItems');if(!box)return;const filtered=auditItems.filter(a=>{let x=auditDesc(a),q=auditFilter.q.toLocaleLowerCase();return(!q||[x.title,x.detail,a.actor,a.details,a.record_type,a.action].some(v=>String(v||'').toLocaleLowerCase().includes(q)))&&(!auditFilter.user||a.actor===auditFilter.user)&&(!auditFilter.action||a.action===auditFilter.action)&&(!auditFilter.from||a.created_at.slice(0,10)>=auditFilter.from)&&(!auditFilter.to||a.created_at.slice(0,10)<=auditFilter.to)});let page=paged('activity',filtered);box.innerHTML=(page.rows.map(a=>{let d=auditDesc(a),type=a.record_type==='payments'&&a.action==='create'?'payment':a.action,k=type==='create'?'＋':type==='update'?'↻':type==='delete'?'×':'¥';let date=new Date(a.created_at);let at=Number.isFinite(date.getTime())?date.toLocaleString(lang==='zh'?'zh-CN':'tr-TR',{dateStyle:'medium',timeStyle:'short'}):a.created_at;return `<div class="history-card"><div class="history-icon ${type}">${k}</div><div><div class="history-title"><b>${esc(d.title)}</b></div><div class="history-desc">${esc(d.detail)}</div><div class="history-meta">${esc(at)} · #${a.id}</div></div></div>`}).join('')||`<p class="empty-hint">${t('auditNoData')}</p>`)+pager('activity',page)}
// Avoid empty later pages after a change to any history filter.
function activityView(){queueMicrotask(async()=>{try{auditItems=await api('/activity');if(tab==='activity')drawAudit()}catch(e){toast(e.message,true)}});return `<div class="section"><div class="history-toolbar"><label>${t('search')}<input id="auditQ" placeholder="${t('auditSearch')}" value="${esc(auditFilter.q)}" oninput="auditFilter.q=this.value;PAGES.activity=1;drawAuditResults()"></label><label>${t('auditUser')}<select id="auditUser" onchange="auditFilter.user=this.value;PAGES.activity=1;drawAuditResults()"><option value="">${t('filterAll')}</option></select></label><label>${t('auditAction')}<select onchange="auditFilter.action=this.value;PAGES.activity=1;drawAuditResults()"><option value="">${t('filterAll')}</option>${['create','update','delete'].map(k=>`<option value="${k}" ${auditFilter.action===k?'selected':''}>${actionName(k)}</option>`).join('')}</select></label><label>${t('from')}<input type="date" value="${auditFilter.from}" onchange="auditFilter.from=this.value;PAGES.activity=1;drawAuditResults()"></label><label>${t('to')}<input type="date" value="${auditFilter.to}" onchange="auditFilter.to=this.value;PAGES.activity=1;drawAuditResults()"></label></div><div id="activityItems"><p class="empty-hint">${t('noActivity')}</p></div></div>`}
function supplierRow(s){let ex=state.expenses.filter(e=>e.supplier_id===s.id&&e.purchase_status!=='cancelled'),balance=ex.reduce((n,e)=>n+Math.max(0,e.amount_fen-e.paid_fen),0);return `<tr><td><b>${esc(s.name)}</b><div class="supplier-muted">${esc(s.contact||'')}</div></td><td>${esc(s.phone||'—')}</td><td>${esc(s.wechat||'—')}</td><td>${ex.length}</td><td class="supplier-balance">${fmt(balance)}</td><td><button class="link" onclick="openSupplier(${s.id})">${t('edit')}</button></td></tr>`}
function supplierResultsHtml(){let page=paged('suppliers',supplierFiltered());return table([t('name'),t('phone'),t('wechat'),t('supplierOrders'),t('outstanding'),t('actions')],page.rows.map(supplierRow))+pager('suppliers',page)}
function supplierView(){return `<div class="headrow">${addButton(t('addSupplier'),'openSupplier')}<span class="muted">${supplierFiltered().length} / ${state.suppliers.length}</span></div><div class="section"><div class="supplier-filters"><input type="search" aria-label="${t('search')}" placeholder="${t('supplierSearch')}" value="${esc(supplierFilter.q)}" oninput="supplierFilter.q=this.value;PAGES.suppliers=1;updateSupplierResults()"><select aria-label="${t('supplierCategory')}" onchange="supplierFilter.category=this.value;PAGES.suppliers=1;updateSupplierResults()"><option value="">${t('supplierCategory')} · ${t('filterAll')}</option>${Object.keys(CAT).map(k=>`<option value="${k}" ${supplierFilter.category===k?'selected':''}>${esc(c(k))}</option>`).join('')}</select><select aria-label="${t('supplierBalance')}" onchange="supplierFilter.balance=this.value;PAGES.suppliers=1;updateSupplierResults()"><option value="">${t('supplierBalance')} · ${t('filterAll')}</option><option value="due" ${supplierFilter.balance==='due'?'selected':''}>${t('hasBalance')}</option><option value="none" ${supplierFilter.balance==='none'?'selected':''}>${t('noBalance')}</option></select></div><div id="supplierResults">${supplierResultsHtml()}</div></div>`}
function updateSupplierResults(){let box=document.getElementById('supplierResults');if(box)box.innerHTML=supplierResultsHtml()}
function documentView(){let r=paged('documents',state.documents);return `<div class="headrow">${addButton(t('addDocument'),'openDocument')}<span class="muted">${r.total}</span></div><div class="section">${table([t('filename'),t('linked'),t('uploadDate'),t('actions')],r.rows.map(d=>`<tr><td>${esc(d.filename)}</td><td>${esc(state.expenses.find(e=>e.id===d.expense_id)?.title||'—')}</td><td>${esc(d.created_at.slice(0,10))}</td><td><button class="link" onclick="location.href='/api/documents/${d.id}'">${t('show')}</button> <button class="link" onclick="remove('documents',${d.id})">${t('delete')}</button></td></tr>`))}${pager('documents',r)}</div>`}
async function loadUsers(){try{let users=await api('/users'),div=document.getElementById('usersTable');if(tab==='users'&&div){let r=paged('users',users);div.innerHTML=table([t('fullname'),t('username'),t('status')],r.rows.map(u=>`<tr><td>${esc(u.fullname)}</td><td>${esc(u.username)}</td><td>${u.role==='owner'?t('owner'):t('partner')}</td></tr>`))+pager('users',r)}}catch(e){toast(e.message,true)}}
// Bounded and searchable fields for long lists: payment expense, document expense, supplier.
function select(name,label,html){if(!['expense_id','supplier_id'].includes(name))return `<label class="field"><span>${label}</span><select name="${name}">${html}</select></label>`;
  return `<label class="field combo-field"><span>${label}</span><input class="combo-search" type="search" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" placeholder="${pl('pick')}" onfocus="showCombo(this)" oninput="filterCombo(this)" onkeydown="comboKeydown(event,this)"><select class="combo-native" name="${name}" aria-hidden="true" tabindex="-1">${name==='expense_id'?'<option value="">—</option>':''}${html}</select><span class="combo-options hidden" role="listbox"></span></label>`;
}
function setupCombos(){document.querySelectorAll('.combo-field').forEach(root=>{let opts=root.querySelector('.combo-options'),native=root.querySelector('.combo-native');opts.innerHTML=[...native.options].map(o=>`<button type="button" role="option" data-val="${esc(o.value)}" onclick="chooseCombo(this)">${esc(o.textContent||pl('none'))}</button>`).join('');syncCombo(root)})}
function syncCombo(root){let native=root.querySelector('.combo-native'),input=root.querySelector('.combo-search');if(!native||!input)return;input.value=native.selectedIndex>=0&&native.value?native.selectedOptions[0].textContent:''}
function syncCombos(){document.querySelectorAll('.combo-field').forEach(syncCombo)}
function showCombo(el){let root=el.closest('.combo-field'),opts=root.querySelector('.combo-options');opts.classList.remove('hidden');el.setAttribute('aria-expanded','true');filterCombo(el,false)}
function filterCombo(el,clearSelection=true){let root=el.closest('.combo-field'),opts=root.querySelector('.combo-options'),native=root.querySelector('.combo-native');if(clearSelection){native.value='';opts.classList.remove('hidden');el.setAttribute('aria-expanded','true')};let q=el.value.trim().toLocaleLowerCase(),visible=0;opts.querySelectorAll('button').forEach(b=>{let ok=b.textContent.toLocaleLowerCase().includes(q);b.hidden=!ok;if(ok)visible++});root.classList.toggle('combo-empty',visible===0);}
function chooseCombo(btn){const root=btn.closest('.combo-field'),native=root.querySelector('.combo-native'),input=root.querySelector('.combo-search');native.value=btn.dataset.val;syncCombo(root);input.focus();root.querySelector('.combo-options').classList.add('hidden');input.setAttribute('aria-expanded','false')}
function comboKeydown(ev,input){let root=input.closest('.combo-field'),opts=root.querySelector('.combo-options');if(ev.key==='Escape'){opts.classList.add('hidden');input.setAttribute('aria-expanded','false');return}if(ev.key==='ArrowDown'){ev.preventDefault();showCombo(input);opts.querySelector('button:not([hidden])')?.focus()}}
document.addEventListener('click',ev=>{document.querySelectorAll('.combo-field').forEach(root=>{if(!root.contains(ev.target)){root.querySelector('.combo-options')?.classList.add('hidden');root.querySelector('.combo-search')?.setAttribute('aria-expanded','false')}})});
function modal(title,fields,action,upload=false){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="closeModal(event)"><div class="modal form-modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" onclick="event.stopPropagation()"><h2>${title}</h2><form id="dialogForm" ${upload?'enctype="multipart/form-data"':''}><div class="formgrid">${fields}</div><div class="actions"><button class="btn alt" type="button" onclick="closeModal()">${t('cancel')}</button><button class="btn">${t('save')}</button></div></form></div></div>`;document.getElementById('modalRoot').classList.remove('hidden');setupCombos();document.getElementById('dialogForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);if(!upload&&e.target.querySelector('.combo-native[name="expense_id"]')&&!f.get('expense_id')){toast(pl('choose'),true);e.target.querySelector('.combo-field .combo-search')?.focus();return}try{await action(f);closeModal();await refresh();toast(t('created'))}catch(e){toast(e.message,true)}}}
function assignForm(values){let f=document.getElementById('dialogForm');for(let [k,v] of Object.entries(values)){let el=f.elements.namedItem(k);if(el)el.value=v??''}syncCombos()}
function openPayment(id){if(!state.expenses.length){toast(t('addExpense'),true);return}modal(t('addPayment'),select('expense_id',t('linked'),expenseOpts())+input('date',t('date'),'date',true,localISODate())+input('amount',t('amount'),'number',true)+select('method',t('method'),opts(METHODS,mt))+input('paid_by',t('paidBy'))+notes(),f=>create('/payments',f));if(id){document.querySelector('[name=expense_id]').value=id;syncCombos()}}
function openPaymentEdit(id){let p=state.payments.find(x=>x.id===id);if(!p)return;modal(t('edit')+' · '+t('payments'),select('expense_id',t('linked'),expenseOpts())+input('date',t('date'),'date',true)+input('amount',t('amount'),'number',true)+select('method',t('method'),opts(METHODS,mt))+input('paid_by',t('paidBy'))+notes(),f=>saveForm('/payments/'+id,f,'PUT'));assignForm({...p,amount:p.amount_fen/100})}

updateLangButtons();init();
</script><script src="/static/updater.js?v=2.3.1"></script></body></html>
